
services:
  api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      # Dentro da rede do compose o Postgres sempre escuta na 5432; a porta
      # publicada no host (POSTGRES_PORT) não se aplica aqui.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - POSTGRES_HOST=database
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES}
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - .:/app
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: postgres:15
    container_name: avoar_postgres_db
    ports:
      # A porta publicada no host vem de POSTGRES_PORT, para conviver com outro
      # Postgres já ocupando a 5432. Quem não tiver conflito define 5432 no .env.
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data:
