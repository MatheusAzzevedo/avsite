<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V8B6Q1ZBRY"></script>
    <script src="../js/gtag-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avoar Turismo - Nova Senha</title>
    <link rel="shortcut icon" href="../images/favicon-avoar.png" type="image/png">
    <link rel="icon" href="../images/favicon-avoar.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 2rem 1rem;
        }

        .login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
            overflow: hidden;
            background: #1a1a1a;
        }

        .login-bg .mosaico-item {
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: fadeInImg 1s ease-in-out forwards;
        }

        .login-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(234, 88, 12, 0.35) 0%, rgba(0, 0, 0, 0.65) 50%, rgba(154, 52, 18, 0.4) 100%);
            z-index: 1;
        }

        @keyframes fadeInImg {
            to {
                opacity: 1;
            }
        }

        .login-right {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: linear-gradient(135deg, #EA580C 0%, #C2410C 50%, #9A3412 100%);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            margin: auto;
        }

        .login-form-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }

        .login-logo {
            width: 180px;
            height: auto;
            margin-bottom: 0.5rem;
        }

        .page-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
        }

        .btn-login {
            width: 100%;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #FB923C 0%, #EA580C 50%, #C2410C 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message,
        .success-message {
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            font-size: 0.875rem;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message {
            background-color: #fef2f2;
            color: #dc2626;
        }

        .success-message {
            background-color: #f0fdf4;
            color: #16a34a;
        }

        .show {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .password-requirements {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
            margin-top: -0.75rem;
            width: 100%;
            text-align: left;
        }

        @media (max-width: 480px) {
            .login-right {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-bg" id="loginBg" aria-hidden="true">
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/%C2%A9Alexandre%20Nery_Avoar_Bernoulli_SP_14.08.2025-180.jpg'); animation-delay: 0.1s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20251022-WA0000.jpg'); animation-delay: 0.2s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/IMG_1839.jpg'); animation-delay: 0.3s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250725-WA0361.jpg'); animation-delay: 0.4s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/roger-nobles-yv4jTtDXviw-unsplash.jpg'); animation-delay: 0.5s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250524-WA0012.jpg'); animation-delay: 0.6s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/IMG_1775.jpg'); animation-delay: 0.7s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250910-WA0076.jpg'); animation-delay: 0.8s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/DSC00349.JPG'); animation-delay: 0.9s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250725-WA0360.jpg'); animation-delay: 1.0s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/IMG_0974.jpg'); animation-delay: 1.1s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250910-WA0091.jpg'); animation-delay: 1.2s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/Utilizar%20essa%20daqui.jpg'); animation-delay: 1.3s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250725-WA0356.jpg'); animation-delay: 1.4s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/IMG_2295.jpg'); animation-delay: 1.5s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250524-WA0013.jpg'); animation-delay: 1.6s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/IMG_1011.jpg'); animation-delay: 1.7s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250910-WA0092.jpg'); animation-delay: 1.8s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/FOTOS%20AVOAR%20PREFERIDAS/IMG-20251119-WA0010.jpg'); animation-delay: 1.9s">
        </div>
        <div class="mosaico-item"
            style="background-image: url('../images/Imagens%20para%20o%20site/IMG-20250725-WA0365.jpg'); animation-delay: 2.0s">
        </div>
    </div>

    <div class="login-right">
        <div class="login-form-wrapper" id="resetWrapper">
            <img src="../images/Logo%20Branca.png" alt="Avoar Turismo" class="login-logo">

            <h1 class="page-title">Nova Senha</h1>
            <p class="page-subtitle">Escolha sua nova senha de acesso.</p>

            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <form id="resetForm" style="display: flex; flex-direction: column; gap: 1.25rem; width: 100%;">
                <input type="password" id="password" name="password" class="form-input" placeholder="Nova Senha"
                    required autocomplete="new-password">
                <p class="password-requirements">Mínimo 8 caracteres, uma letra maiúscula, uma minúscula e um número.
                </p>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                    placeholder="Confirme a Nova Senha" required autocomplete="new-password">

                <button type="submit" class="btn-login" id="submitBtn">
                    <div class="spinner"></div>
                    <span class="btn-text">Alterar Senha</span>
                </button>
            </form>
        </div>

        <div id="invalidToken" style="display: none; flex-direction: column; align-items: center; gap: 1.5rem;">
            <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: white;"></i>
            <h1 class="page-title">Link Inválido</h1>
            <p style="color: white; text-align: center;">Este link de recuperação é inválido ou já expirou.</p>
            <a href="esqueci-senha.html" class="btn-login" style="text-decoration: none;">Solicitar Novo Link</a>
        </div>
    </div>

    <script src="js/auth-manager.js"></script>
    <script src="js/reset-senha.js"></script>
</body>

</html>
